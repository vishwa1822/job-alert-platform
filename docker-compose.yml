version: '3.9'

networks:
  jobpulse-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:

services:

  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobpulse-postgres
    environment:
      POSTGRES_DB: jobpulse
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: jobpulse_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/common/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jobpulse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jobpulse-net
    command: redis-server --appendonly yes

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: jobpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - jobpulse-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: jobpulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - jobpulse-net

  api-gateway:
    build: ./backend/api-gateway
    container_name: jobpulse-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: http://user-service:8081
      JOB_SCRAPER_URL: http://job-scraper-service:8082
      NOTIFICATION_URL: http://notification-service:8083
      RECOMMENDATION_URL: http://recommendation-service:8084
      REDIS_HOST: redis
      JWT_SECRET: jobpulse_jwt_secret_key_2024
    depends_on:
      - redis
      - user-service
    networks:
      - jobpulse-net

  user-service:
    build: ./backend/user-service
    container_name: jobpulse-user
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobpulse
      SPRING_DATASOURCE_USERNAME: jobpulse
      SPRING_DATASOURCE_PASSWORD: jobpulse_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      JWT_SECRET: jobpulse_jwt_secret_key_2024
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - jobpulse-net

  job-scraper-service:
    build: ./backend/job-scraper-service
    container_name: jobpulse-scraper
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobpulse
      SPRING_DATASOURCE_USERNAME: jobpulse
      SPRING_DATASOURCE_PASSWORD: jobpulse_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      SCRAPE_INTERVAL_MS: 300000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - jobpulse-net

  notification-service:
    build: ./backend/notification-service
    container_name: jobpulse-notification
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobpulse
      SPRING_DATASOURCE_USERNAME: jobpulse
      SPRING_DATASOURCE_PASSWORD: jobpulse_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - jobpulse-net

  recommendation-service:
    build: ./backend/recommendation-service
    container_name: jobpulse-recommendation
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobpulse
      SPRING_DATASOURCE_USERNAME: jobpulse
      SPRING_DATASOURCE_PASSWORD: jobpulse_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - jobpulse-net

  frontend:
    build: ./frontend
    container_name: jobpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - jobpulse-net
