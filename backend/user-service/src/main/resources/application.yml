server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobpulse}
    username: ${SPRING_DATASOURCE_USERNAME:jobpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:jobpulse_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  security:
    # All auth handled by api-gateway JWT filter; user-service trusts X-User-Id header
    enabled: false

jwt:
  secret: ${JWT_SECRET:jobpulse_jwt_secret_key_2024}
  expiration: 86400000   # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info
